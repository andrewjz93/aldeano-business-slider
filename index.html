<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Slider Empresas - El Aldeano</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="business-slider">
        <div class="slider-header">
           <div>
             <h2>
               Historias destacadas
            </h2>
          </div>
         </div>

        <!-- ESTE ES EL CONTENEDOR QUE SE MUEVE -->

        <div
            class="slider-viewport"
            id="sliderViewport"
        >
            <div
                class="slider-track"
                id="sliderTrack"
            >
                <div class="loading">
                    Cargando empresas...
                </div>
            </div>
            <button class="slider-arrow slider-arrow-prev" id="sliderPrev"
                type="button" aria-label="Ver publicación anterior"
                aria-controls="sliderTrack" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 5-7 7 7 7"/></svg>
            </button>
            <button class="slider-arrow slider-arrow-next" id="sliderNext"
                type="button" aria-label="Ver publicación siguiente"
                aria-controls="sliderTrack" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg>
            </button>
        </div>
    </section>

    <script
        type="module"
        src="slider.js">
    </script>
</body>

</html>
